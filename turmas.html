<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turmas | ETEC MCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root{--lavender:#E9E8F2;--gray-blue:#8D9DB8;--light-blue:#B7CBEA;--navy:#1E2A54;--steel-blue:#45678C;--white:#FFFFFF;--red:#C1272D;--text-dark:#1E2A54;--text-light:#7280A0;--radius:18px;--shadow:0 10px 30px rgba(30,42,84,.08);--transition:all .3s ease;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Poppins',sans-serif;background:var(--lavender);color:var(--text-dark);min-height:100vh;}
  main{max-width:1200px;margin:0 auto;padding:0 24px; animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  
  .main-header{position:sticky;top:0;z-index:999;background:#fff;box-shadow:0 2px 20px rgba(30,42,84,.07);padding:14px 40px;display:flex;align-items:center;justify-content:space-between;}
  .header-left{display:flex;align-items:center;gap:14px; text-decoration:none;}
  .logo-etec{width:56px;height:56px;border-radius:50%;border:4px solid var(--red);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-etec .etec-text{font-size:6px;font-weight:700;color:var(--red);letter-spacing:1px;}
  .logo-etec .line{width:60%;height:1px;background:var(--red);margin:1px 0;}
  .logo-etec .mcm-text{font-size:14px;font-weight:800;color:var(--red);line-height:1;}
  .header-left h1{font-size:15px;color:var(--navy);font-weight:700;}
  .header-left p{font-size:11px;color:var(--text-light);}
  .header-right{display:flex;align-items:center;gap:14px;}
  .user-chip{display:flex;align-items:center;gap:10px;background:var(--lavender);padding:8px 18px 8px 8px;border-radius:50px;}
  .user-chip .avatar-chip{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .user-chip span{font-size:13px;font-weight:600;color:var(--navy);text-transform:capitalize;}
  .icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--lavender);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);font-size:18px;}
  .icon-btn:hover{background:var(--navy);color:#fff;}
  
  .back-link{display:inline-flex;align-items:center;gap:8px;color:var(--steel-blue);font-weight:600;font-size:14px;margin:26px 0 4px;cursor:pointer;background:none;border:none;font-family:inherit;text-decoration:none;}
  .back-link:hover{color:var(--navy);}
  .breadcrumb-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:24px 0 6px;font-size:13px;color:var(--text-light);font-weight:600;}
  .breadcrumb-bar .active-crumb{color:var(--navy);}
  .breadcrumb-bar i{font-size:9px;}
  
  .page-heading{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:32px;}
  .page-heading h2{font-size:27px;color:var(--navy);font-weight:800;}
  .page-heading p{color:var(--text-light);font-size:13.5px;margin-top:6px;}
  
  .turmas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:60px;}
  .turma-card{background:#fff;border-radius:18px;padding:26px;box-shadow:var(--shadow);cursor:pointer;transition:var(--transition);}
  .turma-card:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(30,42,84,.14);}
  .turma-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .card-icon{width:48px;height:48px;border-radius:14px;background:var(--lavender);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy);}
  .turma-count{background:var(--light-blue);color:var(--navy);font-size:12px;font-weight:700;padding:5px 12px;border-radius:50px;}
  .turma-card h3{color:var(--navy);font-size:17px;margin-bottom:6px;}
  .turma-card p{color:var(--text-light);font-size:13px;}
  .turma-card-footer{display:flex;align-items:center;justify-content:flex-end;margin-top:18px;color:var(--steel-blue);font-weight:600;font-size:13px;gap:6px;}
  
  footer{text-align:center;padding:34px;color:var(--text-light);font-size:12.5px;}
  @media(max-width:900px){.turmas-grid{grid-template-columns:1fr;}.main-header{padding:14px 18px;}.header-left p{display:none;}}
</style>
</head>
<body>

<header class="main-header">
  <a href="index.html" class="header-left">
    <div class="logo-etec">
      <span class="etec-text">ETEC</span>
      <span class="line"></span>
      <span class="mcm-text">MCM</span>
    </div>
    <div>
      <h1>Quinta Feira Tecnológica</h1>
      <p>Sistema de Avaliação de Projetos - ETEC MCM</p>
    </div>
  </a>
  <div class="header-right">
    <div class="user-chip" id="userChip">
      <div class="avatar-chip"><i class="bi bi-person-fill"></i></div>
      <span id="userNameDisplay">Professor</span>
    </div>
    <button class="icon-btn" title="Sair" onclick="sairSistema()"><i class="bi bi-box-arrow-right"></i></button>
  </div>
</header>

<main>
  <a href="periodos.html" class="back-link"><i class="bi bi-arrow-left"></i> Voltar</a>

  <div class="breadcrumb-bar">
    <span>Período</span><i class="bi bi-chevron-right"></i>
    <span class="active-crumb" id="periodoAtualLabel">Manhã</span>
  </div>

  <div class="page-heading">
    <div>
      <h2>Turmas</h2>
      <p>Selecione a turma para visualizar os projetos apresentados</p>
    </div>
  </div>

  <div class="turmas-grid" id="turmasGrid"></div>
</main>

<footer>ETEC Professora Maria Cristina Medeiros — Quinta Feira Tecnológica © 2024</footer>

<script>
  // Dados Simulados
  const turmasData = {
    'Manhã': [
      {id:'t1', nome:'1º DS A', curso:'Desenvolvimento de Sistemas', total:5},
      {id:'t2', nome:'2º ADM B', curso:'Administração', total:4},
      {id:'t3', nome:'3º ENF A', curso:'Enfermagem', total:6}
    ],
    'Tarde': [
      {id:'t4', nome:'1º NUT A', curso:'Nutrição e Dietética', total:3},
      {id:'t5', nome:'2º DS B', curso:'Desenvolvimento de Sistemas', total:5},
      {id:'t6', nome:'3º ADM C', curso:'Administração', total:4}
    ],
    'Noite': [
      {id:'t7', nome:'3º ADM A', curso:'Administração', total:4},
      {id:'t8', nome:'1º ENF B', curso:'Enfermagem', total:2},
      {id:'t9', nome:'2º NUT A', curso:'Nutrição e Dietética', total:3}
    ]
  };

  document.addEventListener('DOMContentLoaded', () => {
    const userName = localStorage.getItem('userName');
    if (userName) document.getElementById('userNameDisplay').textContent = userName;

    const periodo = localStorage.getItem('periodo') || 'Manhã';
    document.getElementById('periodoAtualLabel').textContent = periodo;
    
    renderTurmas(periodo);
  });

  function sairSistema(){
    localStorage.clear();
    window.location.href = 'index.html';
  }

  function renderTurmas(periodo){
    const grid = document.getElementById('turmasGrid');
    const lista = turmasData[periodo] || [];
    grid.innerHTML = lista.map(t => `
      <div class="turma-card" onclick="selecionarTurma('${t.id}','${t.nome}')">
        <div class="turma-card-top">
          <div class="card-icon"><i class="bi bi-people-fill"></i></div>
          <div class="turma-count">${t.total} projetos</div>
        </div>
        <h3>${t.nome}</h3>
        <p>${t.curso}</p>
        <div class="turma-card-footer">Ver projetos <i class="bi bi-arrow-right"></i></div>
      </div>
    `).join('');
  }

  function selecionarTurma(id, nome){
    localStorage.setItem('turmaId', id);
    localStorage.setItem('turmaNome', nome);
    window.location.href = 'projetos.html';
  }
</script>
</body>
</html>
